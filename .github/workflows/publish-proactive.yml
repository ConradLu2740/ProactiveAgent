name: Publish ProactiveAgent Packages

# 通过 npm trusted publishing（OIDC）发布，无需 2FA/token
# 触发：推送 v* 标签（如 v0.1.0）

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC token：npm trusted publishing 需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (gate)
        run: npm test

      - name: Typecheck (gate)
        run: |
          cd packages/proactive-core && npx tsc --noEmit
          cd ../proactive-mcp && npx tsc --noEmit

      - name: Build bundles
        run: bash scripts/publish-proactive.sh --build-only

      # 注意：原 workflow 的 ready gate 用 `echo "ready=true"` 未写入 GITHUB_OUTPUT，
      # steps.check.outputs.ready 永远为空导致 publish 永远 skipped。此处移除 gate，
      # 由 publish 步骤自身幂等（版本已存在则跳过）保证可重复运行。
      - name: Publish @proactive-agent/core
        working-directory: dist-publish/core
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view @proactive-agent/core@$PKG_VERSION version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION already published, skipping (idempotent)"
          else
            npm publish --provenance --access public
          fi

      - name: Publish @proactive-agent/mcp
        working-directory: dist-publish/mcp
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view @proactive-agent/mcp@$PKG_VERSION version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION already published, skipping (idempotent)"
          else
            npm publish --provenance --access public
          fi

      - name: Verify published
        run: |
          npm view @proactive-agent/core version
          npm view @proactive-agent/mcp version
