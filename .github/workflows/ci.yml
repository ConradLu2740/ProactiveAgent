name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --include=optional: 规避 npm/cli#4828（Linux CI 漏装 rollup 平台二进制，vitest 无法启动）
        run: npm ci --include=optional

      - name: Run tests
        run: npm test

      - name: Typecheck all packages
        run: npm run typecheck
