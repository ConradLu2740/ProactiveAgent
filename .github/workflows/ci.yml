name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --include=optional
          # npm/cli#4828: macOS 生成的 lockfile 缺 Linux 平台 rollup 二进制（vitest 依赖），显式补装
          if [ "$RUNNER_OS" = "Linux" ]; then npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu; fi

      - name: Run tests
        run: npm test

      - name: Typecheck all packages
        run: npm run typecheck
